name: Build Android WebView APK (<5MB)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Ultra-Lightweight Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Web Dependencies & Build SPA
        run: |
          npm ci || npm install
          npm run build

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: 📂 Synchronize Web Assets to Android WebView Directory
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: ⚙️ Grant Execution Permission to Gradle
        run: |
          chmod +x android/gradlew || chmod +x gradlew || true

      - name: 🚀 Build Optimized Lightweight APK (Debug & Release)
        working-directory: android
        run: |
          # Use standard gradle wrapper or system gradle
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease assembleDebug --stacktrace
          else
            gradle assembleRelease assembleDebug --stacktrace
          fi

      - name: 📏 Verify APK File Size (<5MB Target)
        working-directory: android/app/build/outputs/apk
        run: |
          echo "=== DAFTAR FILE APK DAN UKURAN ==="
          ls -lh */*.apk || ls -lh *.apk
          echo "=================================="

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Qu-Ecosystem-v1.65-Android-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
